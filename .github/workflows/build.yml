name: Build MSWord x64 Release

on:
  workflow_dispatch: # 允许在网页上手动触发

jobs:
  build:
    runs-on: windows-latest # 使用 GitHub 提供的免费 Windows 服务器
    steps:
      - name: 检出代码
        uses: actions/checkout@v4 # 如果警告持续，可以尝试改为 @v5 (如果已发布)

      - name: 配置 CMake
        run: |
          cd src
          cmake --preset x64-release

      - name: 执行编译
        run: |
          cd src
          cmake --build --preset x64-release --config Release

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: MSWord-Windows-x64-Release
          path: |
            bin/
          if-no-files-found: error
