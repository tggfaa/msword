# Build WORD1.exe on GitHub's free Windows runner.
# GitHub windows-latest ships with: Visual Studio (Desktop dev w/ C++),
# Windows 10/11 SDK, CMake >= 3.25, and PowerShell -- exactly what the project needs.
#
# How to use (no Windows machine required):
#   1. Push this workflow to a repo you own (the workflow fetches the upstream
#      source itself, so you don't need to fork -- just land this file).
#   2. Make sure the file lands at .github/workflows/build.yml.
#   3. GitHub web -> Actions tab -> "Build WORD1.exe" -> Run workflow.
#   4. When it finishes (green check), open the run -> "Artifacts" -> download WORD1-exe.
#   5. Unzip: you get bin/WORD1.exe (the native x64 Microsoft Word 1.1a port).
#
# NOTE on rights: the upstream repo ships no license file. Build for your own
# use; review redistribution rights before sharing the binary.

name: Build WORD1.exe

on:
  workflow_dispatch:        # manual trigger from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: jmarshall23/msword
          fetch-depth: 1

      - name: Set up MSVC / Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Patch CMake preset to match installed Visual Studio
        shell: pwsh
        run: |
          # The upstream src/CMakePresets.json hard-codes generator
          # "Visual Studio 17 2022", but current GitHub runners ship a newer
          # Visual Studio major (e.g. 18). CMake's VS generator only matches the
          # exact major version, so we rewrite the preset to the newest VS
          # generator CMake actually supports -- no hard-coded year guesses.
          #
          # Pick the generator with the highest version year from `cmake --help`
          # (e.g. "Visual Studio 18 2026"), which avoids depending on how the
          # runner reports its VS install. Fall back to the explicit VS major
          # only if the parse yields nothing.
          Write-Host "cmake version: $(cmake --version | Select-Object -First 1)"

          # 1) Collect every "Visual Studio <major> <year> =" generator line.
          $vsLines = cmake --help |
            Select-String -Pattern '^\s*Visual Studio \d+ \d{4}\s*=' |
            ForEach-Object { $_.Line.Trim() }
          Write-Host "VS generator lines found: $($vsLines.Count)"
          $vsLines | ForEach-Object { Write-Host "  $_" }

          if ($vsLines) {
            # Parse "Visual Studio 18 2026 = ..." -> version string "2026"
            $generator = ($vsLines |
              ForEach-Object {
                if ($_ -match 'Visual Studio (\d+) (\d{4})\s*=') {
                  [pscustomobject]@{ Year = [int]$matches[2]; Name = ($_ -split '=')[0].Trim() }
                }
              } |
              Sort-Object Year -Descending |
              Select-Object -First 1).Name
          }

          if (-not $generator) {
            # Fallback: use the explicit VS major version from the environment.
            if ($env:VisualStudioVersion) { $vsMajor = ($env:VisualStudioVersion -split '\.')[0] }
            else {
              $vsDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Directory -ErrorAction SilentlyContinue |
                       Sort-Object Name -Descending | Select-Object -First 1
              $vsMajor = $vsDir.Name
            }
            $fallback = cmake --help |
              Select-String -Pattern "^\s*Visual Studio $vsMajor \d{4}\s*=" |
              Select-Object -First 1
            if (-not $fallback) {
              throw "No CMake Visual Studio generator found (major '$vsMajor'). Aborting."
            }
            $generator = ($fallback.Line -split '=')[0].Trim()
          }

          Write-Host "Selected generator: '$generator'"

          # 2) Rewrite the preset JSON. Build the replacement string so it
          #    results in exactly one pair of JSON quotes around the generator
          #    name (not two), and validate the JSON afterwards.
          $presetPath = Join-Path $env:GITHUB_WORKSPACE 'src' 'CMakePresets.json'
          $json = Get-Content $presetPath -Raw
          $replacement = '"' + $generator + '"'
          $newJson = $json -replace '"Visual Studio \d+ 20\d\d"', $replacement

          # 3) Sanity check: the rewritten file must still be valid JSON.
          try { $null = $newJson | ConvertFrom-Json } catch {
            throw "Rewritten CMakePresets.json is invalid JSON: $($_.Exception.Message)"
          }
          Set-Content $presetPath $newJson
          Write-Host "New generator line in preset:"
          Select-String -Path $presetPath -Pattern '"generator"'

      - name: Show tool versions (sanity check)
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -requires Microsoft.VisualStudio.Workload.VCTools `
              -property installationVersion
          } else {
            Write-Host "vswhere.exe not found at default path (non-fatal)."
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio" `
              -Directory -ErrorAction SilentlyContinue | Select-Object Name
          }

      - name: Detect installed Windows SDK version
        id: sdk
        shell: pwsh
        run: |
          $sdkInclude = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $versions = Get-ChildItem $sdkInclude -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'um\Windows.h') } |
            Sort-Object Name -Descending
          if (-not $versions) { throw 'No Windows SDK with um/Windows.h found.' }
          $sdkVer = $versions[0].Name
          echo "Selected Windows SDK: $sdkVer"
          "SDK_VERSION=$sdkVer" >> $env:GITHUB_ENV

      - name: Configure (x64 Release preset)
        working-directory: src
        shell: pwsh
        run: cmake --preset x64-release -DCMAKE_VS_WINDOWS_TARGET_PLATFORM_VERSION="$env:SDK_VERSION"

      - name: Build WORD1 target
        shell: pwsh
        run: cmake --build --preset x64-release --target WORD1

      - name: Upload WORD1.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: WORD1-exe
          path: bin/WORD1.exe
          if-no-files-found: error


