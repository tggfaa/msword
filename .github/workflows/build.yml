# Build WORD1.exe on GitHub's free Windows runner.
# We use the pinned "windows-2022" image: it ships Visual Studio 17 2022,
# which exactly matches the generator ("Visual Studio 17 2022") that the
# upstream src/CMakePresets.json hard-codes. The rolling "windows-latest"
# image has moved to Visual Studio 18, which older CMake (4.x) does not
# recognize as a generator, so the preset's fixed generator would fail.
#
# How to use (no Windows machine required):
#   1. Push this workflow to a repo you own (the workflow fetches the upstream
#      source itself, so you don't need to fork -- just land this file).
#   2. Make sure the file lands at .github/workflows/build.yml.
#   3. GitHub web -> Actions tab -> "Build WORD1.exe" -> Run workflow.
#   4. When it finishes (green check), open the run -> "Artifacts" -> download WORD1-exe.
#   5. Unzip: you get bin/WORD1.exe (the native x64 Microsoft Word 1.1a port).
#
# NOTE on rights: the upstream repo ships no license file. Build for your own
# use; review redistribution rights before sharing the binary.

name: Build WORD1.exe

on:
  workflow_dispatch:        # manual trigger from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: jmarshall23/msword
          fetch-depth: 1

      - name: Set up MSVC / Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show tool versions (sanity check)
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -requires Microsoft.VisualStudio.Workload.VCTools `
              -property installationVersion
          } else {
            Write-Host "vswhere.exe not found at default path (non-fatal)."
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio" `
              -Directory -ErrorAction SilentlyContinue | Select-Object Name
          }

      - name: Detect installed Windows SDK version
        id: sdk
        shell: pwsh
        run: |
          $sdkInclude = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $versions = Get-ChildItem $sdkInclude -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'um\Windows.h') } |
            Sort-Object Name -Descending
          if (-not $versions) { throw 'No Windows SDK with um/Windows.h found.' }
          $sdkVer = $versions[0].Name
          echo "Selected Windows SDK: $sdkVer"
          "SDK_VERSION=$sdkVer" >> $env:GITHUB_ENV

      - name: Configure (x64 Release preset)
        working-directory: src
        shell: pwsh
        run: cmake --preset x64-release -DCMAKE_VS_WINDOWS_TARGET_PLATFORM_VERSION="$env:SDK_VERSION"

      - name: Build WORD1 target
        shell: pwsh
        run: cmake --build --preset x64-release --target WORD1

      - name: Upload WORD1.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: WORD1-exe
          path: bin/WORD1.exe
          if-no-files-found: error


